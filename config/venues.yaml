# Every source the tracker checks. Keys are the short venue ids used in commands and state.
#
# adapter: which lookup method to use (see src/teatar/adapters/*):
#   narodno_html        HTML scrape: on sale / under 10% left / sold out; exact seats with NARODNO_EMAIL/PASSWORD
#   bdp_webflow_sixtix  Webflow HTML catalog + Sixtix on-sale API
#   jdp_wp_ajax         WordPress AJAX month feed
#   tickets_rs          tickets.rs JSON API (any venue: just set its slug)
#   kupikartu_pos       "Kupi kartu" box-office JSON API (bilet.*/blagajna.* sites): set base_url
#   madlenianum_html    Madlenianum own site (repertoire list + month calendar): dates only; with
#                       MADLENIANUM_EMAIL/PASSWORD also its ticket shop: tickets left, and dates only the shop has
#
# website: the theatre's own repertoire page, linked at the bottom of release messages
#   (tickets.rs venues default to their tickets.rs venue page).
#
# look: how the theatre's release messages are styled (all optional; without it: bold titles, no banner).
#   banner   the picture at the top of the message: a file in assets/banners (without .jpg)
#   titles   bold | italic        upper: true for capitals        marker: put before each title
#   dates    lines (indented under the title) | quote (in a quote block)
#   rule     an ornament line between the header and the plays
#
# To add another tickets.rs venue, copy a tickets_rs block and change slug + name.
# To disable a source temporarily, add `enabled: false`.

narodno:
  adapter: narodno_html
  name: Narodno pozorište
  website: https://www.narodnopozoriste.rs/repertoar
  seat_counts:  # exact seats left need a login (NARODNO_EMAIL / NARODNO_PASSWORD secrets); it logs in only for these:
    daily_at: "09:00"  # every on-sale date, once a day, at the first check after this time
    after_release_minutes: 90  # new dates, at the first check at least this long after they appeared
    # going easy on the site, so the account isn't blocked:
    page_seconds: 3  # wait between ticket pages
    min_gap_minutes: 60  # at most one login per this long (release-day polling scans every 10 min)
    retry_hours: 3  # after a failed count, don't log in again for this long
  look: {banner: narodno, titles: italic, marker: "❦", dates: quote, rule: "— ❦ —"}

bdp:
  adapter: bdp_webflow_sixtix
  name: BDP
  website: https://www.bdp.rs/cir/repertoar
  stages: ["Велика сцена"]  # only Velika scena "Olivera i Rade"; remove to track all stages
  include_guest: false  # skip guest performances in other cities
  sixtix_iframe: 22c6e158  # BDP "Main website" on-sale list on Sixtix
  look: {banner: bdp, titles: bold, upper: true, marker: "🟥", dates: quote}

jdp:
  adapter: jdp_wp_ajax
  name: JDP
  website: https://www.jdp.rs/rs/repertoire-feed/
  months_ahead: 2
  look: {banner: jdp, titles: bold, upper: true, marker: "🔴", dates: quote}

terazije:
  adapter: kupikartu_pos
  name: Pozorište na Terazijama
  website: https://pozoristeterazije.com/repertoar/
  base_url: https://bilet.pozoristeterazije.com
  site_url: https://pozoristeterazije.com/repertoar/
  months_ahead: 2
  look: {banner: terazije, titles: italic, marker: "♦️", dates: quote}

sava_centar:
  adapter: tickets_rs
  name: Sava Centar
  slug: sava_centar_3
  look: {banner: sava_centar, titles: bold, marker: "🟧", dates: quote}

madlenianum_tickets:
  adapter: tickets_rs
  name: Madlenianum (tickets.rs)
  slug: opera_i_teatar_madlenianum_53
  look: {banner: madlenianum, titles: italic, marker: "✦", dates: quote, rule: "· · · ✦ · · ·"}

kolarac:
  adapter: tickets_rs
  name: Kolarac
  slug: kolarceva_zaduzbina_55
  look: {banner: kolarac, titles: bold, marker: "🎼", dates: quote}

madlenianum:
  adapter: madlenianum_html
  name: Madlenianum
  website: https://operatheatremadlenianum.com/repertoar
  months_ahead: 2  # their repertoire page stops at the end of this month; later months come from the site's calendar
  shop: true  # also read their ticket shop when the MADLENIANUM_EMAIL / MADLENIANUM_PASSWORD secrets are set
  look: {banner: madlenianum, titles: italic, marker: "✦", dates: quote, rule: "· · · ✦ · · ·"}
