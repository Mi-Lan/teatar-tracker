# Timezone for everything below: Europe/Belgrade.

digest:  # the scheduled overview: everything until the end of next month
  every: off  # off | weekly | daily — off: nothing scheduled, /month shows the same on demand
  weekday: monday
  time: "08:00"
  until: next_month  # covers today → end of next month; set to "days" to use `days` instead
  days: 7

release_season:  # most theatres publish next month and open sales between these days
  days: [20, 27]  # on each of these days: a "tickets for next month" status per theatre…
  times: []  # …at these times, e.g. ["00:05", "08:00"]. Empty: no scheduled status; /tickets shows it on demand.
  # A release is messaged the moment it is seen, any day of the month: next month's first tickets at a
  # theatre, at least this many new dates / sales openings at one theatre in a single check, or any new
  # tickets at a theatre with a known release around now (/release, releases.yaml).
  batch_min: 5

alerts:
  # What is messaged immediately, besides releases (always). "releases_and_watchlist": only plays on
  # your /watch list; everything else just appears in /new and /month. "all": every new show/date/sale
  # as soon as it's found.
  instant: releases_and_watchlist
  low_threshold: 20  # watched plays: warn when fewer tickets than this are left (where counts exist)

releases:
  remind_before: []  # reminders before a known ticket release, e.g. ["24h", "1h"]; empty: none
  report_misses: false  # true: a note when a release window closes with no new tickets
  lookahead_minutes: 150  # a run starting this long before a release switches into burst mode (checks are hourly)
  start_before_minutes: 10  # burst polling starts this long before the release time
  stop_after_minutes: 45  # ...and ends this long after it
  poll_seconds: 30  # how often the release venue is re-checked during a burst
  full_scan_minutes: 10  # full scan of all venues during a burst

health:
  failures_before_alert: 3  # consecutive failed/empty scans before warning that a site may have changed
