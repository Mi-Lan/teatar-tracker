name: widget-test

# Temporary (this branch only): sends the experimental framed-playbill widget to the bot's owner, to
# see it in the real Telegram apps. TELEGRAM_EXTRA_CHAT_IDS is deliberately not passed.
on:
  push:
    branches: ["claude/lucid-turing-364smz"]
    paths: [".github/workflows/widget-test.yml", "scripts/send_test_widget.py"]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - run: python scripts/send_test_widget.py
