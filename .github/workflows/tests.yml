name: tests

# Runs the test suite on every push that touches code or config. The tracker's own state commits
# (data/**) don't start it: they are pushed with the workflow token, and are excluded below as well.
on:
  push:
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # the version the tracker runs on (tracker.yml)
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: pytest -q
