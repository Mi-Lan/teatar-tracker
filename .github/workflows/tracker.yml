name: tracker

on:
  schedule:
    # Every 15 minutes, off the top of the hour (GitHub delays :00 runs the most). GitHub often
    # delays or skips scheduled runs (an hourly schedule here ran only every 3–6 h), so a denser
    # schedule keeps the gaps short: the gap between checks is how precisely "when did the tickets
    # come out" can be answered. Checks are silent unless something needs your attention; release
    # windows keep a run alive to poll every 30 s, and `concurrency` makes later runs wait.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal check · overview = send everything · test = test message with the theatres"
        type: choice
        default: run
        options: [run, overview, test]

permissions:
  contents: write  # commit data/state.json

concurrency:
  group: tracker  # one run at a time; a burst keeps the lock and later runs wait
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}  # more people who get every notification (comma-separated)
      NARODNO_EMAIL: ${{ secrets.NARODNO_EMAIL }}  # a narodnopozoriste.rs account: exact seat counts (optional)
      NARODNO_PASSWORD: ${{ secrets.NARODNO_PASSWORD }}
      # a Madlenianum ticket-shop account: dates and tickets left that only show when signed in (optional).
      # The email falls back to the Narodno one, for an account registered with the same address.
      MADLENIANUM_EMAIL: ${{ secrets.MADLENIANUM_EMAIL || secrets.NARODNO_EMAIL }}
      MADLENIANUM_PASSWORD: ${{ secrets.MADLENIANUM_PASSWORD }}
    steps:
      # The branch's latest commit, not the one the run was queued at: a run that waited behind a
      # long release burst would otherwise start from the state.json before that burst (its new
      # dates would look new again) and then fail to push over it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Run tracker
        timeout-minutes: 225  # leave time to commit state even after a long release burst
        run: |
          case "${{ inputs.mode || 'run' }}" in
            run)      teatar run ;;
            overview) teatar overview --all --send ;;
            test)     teatar telegram-test ;;
          esac

      - name: Commit state
        if: always()
        run: |
          git config user.name "theatre-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/state.json ] || exit 0
          # Runs never overlap (concurrency), so this run's state.json is the newest there is: put it
          # on top of whatever else reached the branch meanwhile (code, config) instead of rebasing
          # it, which conflicts whenever the file changed on both sides.
          cp data/state.json "$RUNNER_TEMP/state.json"
          for i in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/state.json" data/state.json
            git add data/state.json
            git diff --cached --quiet && { echo "state unchanged"; exit 0; }
            git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
