name: banner-test

# Temporary (this branch only): sends one sample message per theatre look to the bot's owner, to see the
# banners and text styles in the real Telegram apps. TELEGRAM_EXTRA_CHAT_IDS is deliberately not passed.
on:
  push:
    branches: ["claude/lucid-turing-364smz"]
    paths: [".github/workflows/banner-test.yml", "scripts/send_test_banners.py"]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - run: python scripts/send_test_banners.py
