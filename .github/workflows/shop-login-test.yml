name: shop-login-test

# Temporary (this branch only): runs the real Madlenianum reader once with the account in the repo's
# secrets and prints its table (titles, dates, status, tickets left: nothing from the account).
# Removed again before this work is merged.
on:
  push:
    branches: ["claude/lucid-turing-364smz"]
    paths: [".github/workflows/shop-login-test.yml", "src/teatar/adapters/madlenianum.py"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # the shop account uses the same email as the Narodno one, unless MADLENIANUM_EMAIL is set
      MADLENIANUM_EMAIL: ${{ secrets.MADLENIANUM_EMAIL || secrets.NARODNO_EMAIL }}
      MADLENIANUM_PASSWORD: ${{ secrets.MADLENIANUM_PASSWORD }}
      COLUMNS: "220"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - run: teatar scan --venue madlenianum
