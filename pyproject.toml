[project]
name = "teatar"
version = "0.1.0"
description = "Belgrade theatre repertoire, availability and ticket-release tracker with Telegram alerts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
teatar = "teatar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teatar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
